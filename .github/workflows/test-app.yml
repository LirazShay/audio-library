name: Test App

on:
  push:
    branches:
      - main
    paths:
      - src/app/**
      - src/data/library.json
      - tools/library-service.test.mjs
      - tools/router-service.test.mjs
      - tools/app-routing.test.mjs
      - tools/m3-routing-integration.test.mjs
      - tools/m4-topics.test.mjs
      - tools/m5-tracks.test.mjs
      - tools/audio-service.test.mjs
      - tools/m6-track-page.test.mjs
      - tools/m7-player.test.mjs
      - .github/workflows/test-app.yml
  pull_request:
    paths:
      - src/app/**
      - src/data/library.json
      - tools/library-service.test.mjs
      - tools/router-service.test.mjs
      - tools/app-routing.test.mjs
      - tools/m3-routing-integration.test.mjs
      - tools/m4-topics.test.mjs
      - tools/m5-tracks.test.mjs
      - tools/audio-service.test.mjs
      - tools/m6-track-page.test.mjs
      - tools/m7-player.test.mjs
      - .github/workflows/test-app.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Check browser module syntax
        run: |
          cp src/app/services/library-service.js /tmp/library-service.mjs
          cp src/app/services/router-service.js /tmp/router-service.mjs
          cp src/app/services/audio-service.js /tmp/audio-service.mjs
          cp src/app/state/app-state.js /tmp/app-state.mjs
          cp src/app/state/router-state.js /tmp/router-state.mjs
          cp src/app/state/player-state.js /tmp/player-state.mjs
          cp src/app/main.js /tmp/main.mjs
          cp src/app/app.js /tmp/app.mjs
          cp src/app/pages/home-page.js /tmp/home-page.mjs
          cp src/app/pages/not-found-page.js /tmp/not-found-page.mjs
          cp src/app/pages/topic-page.js /tmp/topic-page.mjs
          cp src/app/pages/track-page.js /tmp/track-page.mjs
          cp src/app/components/topic-card.js /tmp/topic-card.mjs
          cp src/app/components/breadcrumb.js /tmp/breadcrumb.mjs
          cp src/app/components/track-row.js /tmp/track-row.mjs
          cp src/app/components/full-player.js /tmp/full-player.mjs
          cp src/app/components/progress-bar.js /tmp/progress-bar.mjs
          node --check /tmp/library-service.mjs
          node --check /tmp/router-service.mjs
          node --check /tmp/audio-service.mjs
          node --check /tmp/app-state.mjs
          node --check /tmp/router-state.mjs
          node --check /tmp/player-state.mjs
          node --check /tmp/main.mjs
          node --check /tmp/app.mjs
          node --check /tmp/home-page.mjs
          node --check /tmp/not-found-page.mjs
          node --check /tmp/topic-page.mjs
          node --check /tmp/track-page.mjs
          node --check /tmp/topic-card.mjs
          node --check /tmp/breadcrumb.mjs
          node --check /tmp/track-row.mjs
          node --check /tmp/full-player.mjs
          node --check /tmp/progress-bar.mjs

      - name: Check App component mounting
        run: |
          node -e "const fs=require('node:fs'); const s=fs.readFileSync('src/app/main.js','utf8'); if(!s.includes('render(h(App, null), root)')) throw new Error('App must be mounted as a Preact component so Signals stay reactive.');"

      - name: Run Library Loader tests
        run: node --test tools/library-service.test.mjs

      - name: Run Router tests
        run: node --test tools/router-service.test.mjs

      - name: Run App routing tests
        run: node --test tools/app-routing.test.mjs

      - name: Run M3 routing integration tests
        run: node --test tools/m3-routing-integration.test.mjs

      - name: Run M4 Topic tests
        run: node --test tools/m4-topics.test.mjs

      - name: Run M5 Track tests
        run: node --test tools/m5-tracks.test.mjs

      - name: Run Audio Service tests
        run: node --test tools/audio-service.test.mjs

      - name: Run M6 Track Page tests
        run: node --test tools/m6-track-page.test.mjs

      - name: Run M7 Player tests
        run: node --test tools/m7-player.test.mjs

      - name: Check M6.1 Audio startup wiring
        run: |
          node -e "const fs=require('node:fs'); const main=fs.readFileSync('src/app/main.js','utf8'); const state=fs.readFileSync('src/app/state/player-state.js','utf8'); if(!main.includes('initializeAudioService()')) throw new Error('Audio service must initialize once from main.js.'); if(!state.includes('currentTrack = signal(null)') || !state.includes('playerStatus = signal(PLAYER_STATUS.IDLE)')) throw new Error('M6.1 player Signals are missing.');"

      - name: Check M3.2 router wiring
        run: |
          node -e "const fs=require('node:fs'); const main=fs.readFileSync('src/app/main.js','utf8'); const state=fs.readFileSync('src/app/state/router-state.js','utf8'); if(!main.includes('startRouter(setCurrentRoute)')) throw new Error('Router runtime must initialize from main.js.'); if(!state.includes('currentRoute = signal(')) throw new Error('currentRoute must be a Preact Signal.');"

      - name: Check M2 loaded-state totals
        run: |
          node -e "const fs=require('node:fs'); const s=fs.readFileSync('src/app/pages/home-page.js','utf8'); if(!s.includes('getAllTopics().length') || !s.includes('getAllTracks().length')) throw new Error('Home loaded-state UI must show total Topic and Track counts from Library Service.');"

      - name: Verify real library recursive indexes
        run: |
          cp src/app/services/library-service.js /tmp/library-service.mjs
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const m=await import('file:///tmp/library-service.mjs'); const doc=JSON.parse(fs.readFileSync('src/data/library.json','utf8')); m.validateLibraryDocument(doc); const indexes=m.buildLibraryIndexes(doc.root); let topics=0,tracks=0; const visit=(node,isRoot=false)=>{ if(node.type==='topic'){ if(!isRoot) topics++; for(const child of node.children) visit(child,false); } else if(node.type==='track'){ tracks++; } }; visit(doc.root,true); assert.equal(indexes.allTopics.length,topics); assert.equal(indexes.allTracks.length,tracks); assert.equal(indexes.topicsById.get('root'),doc.root);"

      - name: Validate current library document
        run: |
          cp src/app/services/library-service.js /tmp/library-service.mjs
          node --input-type=module -e "import fs from 'node:fs'; import assert from 'node:assert/strict'; const m=await import('file:///tmp/library-service.mjs'); const doc=JSON.parse(fs.readFileSync('src/data/library.json','utf8')); assert.equal(m.validateLibraryDocument(doc),doc); assert.throws(()=>m.validateLibraryDocument({...doc,schemaVersion:999}),/Unsupported library schemaVersion/);"
