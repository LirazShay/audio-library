name: Test Browser E2E

on:
  push:
    branches:
      - main
    paths:
      - src/**
      - e2e/**
      - tools/dev-server.js
      - tools/generate-library.js
      - package.json
      - playwright.config.cjs
      - .github/workflows/test-e2e.yml
  pull_request:
    paths:
      - src/**
      - e2e/**
      - tools/dev-server.js
      - tools/generate-library.js
      - package.json
      - playwright.config.cjs
      - .github/workflows/test-e2e.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browser-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright test runner
        run: npm install --no-audit --no-fund

      - name: Install Headless Chromium
        run: npx playwright install --with-deps chromium

      - name: Regenerate library data
        run: node tools/generate-library.js

      - name: Run browser E2E tests
        run: npm run test:e2e

      - name: Upload Playwright failure artifacts
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-e2e-failure
          path: |
            playwright-report/
            test-results/
          if-no-files-found: ignore
          retention-days: 7
